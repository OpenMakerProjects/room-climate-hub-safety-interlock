<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
<title>ESP8266 microphone and PIR demonstration interlock with BLE UART</title>
<rect width="1100" height="700" fill="white"/>
<g font-family="sans-serif" font-size="18" fill="#122b40">
<text x="30" y="35">ID9 • NodeMCU v2 • USB 5V only • all signal logic 3.3V</text>
<rect x="50" y="160" width="300" height="400" fill="#e8f3fa" stroke="#122b40"/>
<text x="70" y="195">NodeMCU ESP8266</text><text x="70" y="230">3V3</text><text x="70" y="285">A0 (board input ≤3.3V)</text><text x="70" y="340">D5 / GPIO14 IN</text><text x="70" y="395">D6 / GPIO12 RX</text><text x="70" y="450">D7 / GPIO13 TX</text><text x="70" y="505">D2 / GPIO4 OUT</text><text x="70" y="550">GND</text>
<rect x="650" y="150" width="390" height="110" fill="#f0faf0" stroke="#122b40"/><text x="670" y="180">Analog electret module (3.3V)</text><text x="670" y="210">VCC → 3V3; GND → common GND</text><text x="670" y="240">OUT (0–3.3V) → A0</text>
<rect x="650" y="290" width="390" height="85" fill="#f0faf0" stroke="#122b40"/><text x="670" y="315">HC-SR501 PIR</text><text x="670" y="340">VCC → USB 5V; OUT 3.3V → D5</text><text x="670" y="365">GND → common GND</text>
<rect x="650" y="400" width="390" height="110" fill="#f0faf0" stroke="#122b40"/><text x="670" y="425">Raw HM-10 BLE UART @9600</text><text x="670" y="450">TXD → D6 RX; RXD ← D7 TX</text><text x="670" y="475">VCC → 3V3; GND → common GND</text><text x="670" y="500">FFE0 service / FFE1 serial characteristic</text>
<text x="650" y="555">D2 → 330Ω → LED anode; cathode → GND</text>
<text x="30" y="625">USB 5V feeds NodeMCU USB and PIR VCC. 3V3 feeds microphone and raw HM-10.</text>
<text x="30" y="660">No actuator. LED is a permission demonstration; not a certified safety controller.</text>
</g>
<g fill="none" stroke="#276d8c" stroke-width="3"><path d="M350 280 H520 V240 H650"/><path d="M350 335 H650"/><path d="M350 390 H550 V450 H650"/><path d="M350 445 H600 V480"/><path d="M350 500 H500 V550 H640"/></g>
<path d="M350 545 H570 V585 H1040" stroke="#222" stroke-width="3" fill="none"/><text x="700" y="605" font-family="sans-serif" font-size="16">COMMON GND rail: NodeMCU + all modules + LED</text>
</svg>